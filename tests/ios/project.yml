name: HomeframeSimulatorTests
options:
  bundleIdPrefix: dev.homeframe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  HomeframeTestHost:
    type: application
    platform: iOS
    sources:
      - Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.homeframe.simulator-host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  HomeframeSimulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: HomeframeTestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.homeframe.simulator-ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HomeframeTestHost
schemes:
  HomeframeSimulatorTests:
    build:
      targets:
        HomeframeTestHost: all
        HomeframeSimulatorUITests: [test]
    test:
      targets:
        - HomeframeSimulatorUITests
      gatherCoverageData: false
